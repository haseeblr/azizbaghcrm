    function render() {
      // Never repaint over in-progress typing: background refreshes (realtime, timers)
      // wait until the field blurs — the blur itself triggers a save + fresh render.
      const ae = document.activeElement;
      if (ae && (ae.dataset && ae.dataset.menuDate || ae.id === 'ki-name') && ae.value !== undefined && state.user) return;
      const app = document.getElementById('app');
      if (!state.ready) { app.innerHTML = '<div class="boot"><div class="spinner"></div>Loading…</div>'; return; }
      if (!state.user) { app.innerHTML = (state.errorMsg ? `<div class="banner-warn" style="margin-bottom:8px;"><div>⚠️</div><div style="font-size:14px;color:var(--warn-ink);">${esc(state.errorMsg)}</div></div>` : '') + renderLogin(); return; }
      if (state.user.must_change) { app.innerHTML = renderChangePassword(true); return; }
      let html = renderHeader();
      if (!CONFIGURED) {
        html += `<div class="banner-setup">🔌 <strong>Demo mode</strong> — data is saved only on this device. To share it with all flatmates, connect the free Supabase database (see README.md) and redeploy.</div>`;
      }
      if (state.errorMsg) {
        html += `<div class="banner-warn"><div style="font-size:20px;line-height:1;">⚠️</div><div style="font-size:14px;color:var(--warn-ink);">${esc(state.errorMsg)}</div></div>`;
      }
      if (state.kitchenFlagMissing) {
        html += `<div class="banner-warn"><div style="font-size:20px;line-height:1;">🗄️</div><div style="flex:1;">
          <div style="font-weight:700;font-size:14px;color:var(--warn-ink);">Kitchen membership not visible to the app</div>
          <div style="font-size:14px;color:var(--warn-ink);margin-top:4px;">The <strong>in_kitchen</strong> column isn't coming back from the API, so everyone counts as a kitchen member. Run <strong>ghar_setup_v3.7.sql</strong>, then run <code style="background:var(--surface-2);padding:1px 5px;border-radius:5px;">notify pgrst, 'reload schema';</code> in the Supabase SQL editor and reload this page.</div>
        </div></div>`;
      }
      if (!state.flatmates.length) {
        html += `<div class="banner-warn" style="background:var(--danger-soft);border-color:var(--danger-border);"><div style="font-size:20px;line-height:1;">⚠️</div><div style="flex:1;">
          <div style="font-weight:700;font-size:14px;color:var(--danger-ink);">No flatmates in the database</div>
          <div style="font-size:14px;color:var(--danger-ink);margin-top:4px;">The <strong>flatmates</strong> table is empty, so there's nobody to schedule. Add rows to it in Supabase (see README.md), then reload.</div>
        </div></div>`;
      }
      if (!state.turns.length) {
        html += '<div class="boot">No schedule data yet.</div>';
      } else if (state.tab === 'kitchen' && !canSeeKitchen()) { state.tab = 'dashboard'; html += renderDashboard(); }
      else if (state.tab === 'dashboard') html += renderDashboard();
      else if (state.tab === 'kitchen') html += renderKitchen();
      else if (state.tab === 'schedule') html += renderSchedule();
      else if (state.tab === 'history') html += renderHistory();
      else if (state.tab === 'admin') html += renderAdmin();
      html += renderModals();
      app.innerHTML = html;
    }

    /* ================= boot ================= */
    (async function boot() {
      try {
        store = (CONFIGURED && window.supabase) ? new SupaStore() : new LocalStore();
        await store.init();
        applyData(await store.fetchAll());
        await migrateAppName();
        if (await ensureTurnsCover()) applyData(await store.fetchAll());
        if (await ensureGroceryCover()) applyData(await store.fetchAll());
        if (await healOrphanItems()) applyData(await store.fetchAll());
        store.onChange(() => refresh());
      } catch (e) {
        store = new LocalStore();
        await store.init();
        applyData(await store.fetchAll());
        await migrateAppName();
        if (await ensureTurnsCover()) applyData(await store.fetchAll());
        if (await ensureGroceryCover()) applyData(await store.fetchAll());
        state.errorMsg = 'Could not reach the database (' + (e.message || e) + '). Running in on-device demo mode.';
      }
      const tok = localStorage.getItem('f6_token');
      if (tok) {
        try {
          const u = await store.me(tok);
          if (u) {
            state.user = u; state.session = tok;
            if (u.is_admin) { try { state.users = await store.listUsers(tok); } catch (_) { state.users = []; } }
          } else localStorage.removeItem('f6_token');
        } catch (_) { localStorage.removeItem('f6_token'); }
      }
      localStorage.removeItem('f6_session'); // old insecure session id, no longer used
      state.ready = true;
      render();
      setInterval(render, 10 * 60 * 1000);
    })();

    /* ---- UI polish: sticky-bar shadow, scroll-to-top, sliding tab underline ---- */
    (function uiChrome() {
      const toTop = document.getElementById('to-top');
      if (toTop) toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

      let ticking = false;
      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          const y = window.scrollY || 0;
          const bar = document.getElementById('tabbar');
          // .stuck (border + shadow) engages once the bar has actually reached the top edge
          if (bar) {
            const top = bar.getBoundingClientRect().top;
            bar.classList.toggle('stuck', top <= 0.5);
          }
          if (toTop) toTop.classList.toggle('show', y > 320);
          ticking = false;
        });
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      onScroll();

      // Sliding underline under the active tab — positioned to the active pill after each render.
      const place = () => {
        const bar = document.getElementById('tabbar');
        if (!bar) return;
        const tabs = bar.querySelector('.tabs');
        const active = bar.querySelector('.tab.active');
        if (!tabs || !active) return;
        let ink = bar.querySelector('.tab-ink');
        if (!ink) {
          ink = document.createElement('div');
          ink.className = 'tab-ink';
          ink.style.cssText = 'position:absolute;height:2.5px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));bottom:-1px;transition:left .25s cubic-bezier(.2,.8,.3,1),width .25s cubic-bezier(.2,.8,.3,1);pointer-events:none;';
          tabs.style.position = 'relative';
          tabs.appendChild(ink);
        }
        ink.style.left = (active.offsetLeft + 8) + 'px';
        ink.style.width = (active.offsetWidth - 16) + 'px';
      };
      // Re-place underline AND re-check scroll state after every render (render() replaces
      // #app innerHTML; content height changes, so a stale .show/.stuck must be recomputed).
      const obs = new MutationObserver(() => requestAnimationFrame(() => { place(); onScroll(); }));
      const appEl = document.getElementById('app');
      if (appEl) obs.observe(appEl, { childList: true, subtree: true });
      requestAnimationFrame(place);
    })();
